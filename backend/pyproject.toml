[project]
name = "clipgen-backend"
version = "0.1.0"
description = "Backend for the YouTube AI Clip Generator"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: calls real external tools (opt-in via environment variables)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
